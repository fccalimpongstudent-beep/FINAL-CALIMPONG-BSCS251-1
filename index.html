<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eternaldoll</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- HEADER -->
  <header>
    <h1>Eternaldoll</h1>
    <p class="subtitle">Elegance. Aesthetic. Identity.</p>
  </header>

  <!-- MAIN CONTENT -->
  <section class="main">

    <!-- LEFT SECTION -->
    <div class="left">
      <h2>About Eternaldoll</h2>
      <p>
        Eternaldoll is all about expressing identity through style,
        confidence, and presence. A space for clean looks, strong energy,
        and your signature vibe.
      </p>

      <!-- ICONS -->
      <div class="icons">
        <div class="icon">⭐</div>
        <div class="icon">💎</div>
        <div class="icon">✨</div>
      </div>

      <!-- 3 PICTURES -->
      <div class="gallery">
        <img src="/images/Heelsforeternall1.jpg" alt="">
        <img src="/images/Heelsforeternall2.jpg" alt="">
        <img src="/images/Heelsforeternall3.jpg" alt="">
      </div>
    </div>

    <!-- RIGHT MAIN IMAGE -->
    <div class="right">
      <img src="yourimage.jpg" alt="Eternaldoll Image">
    </div>

  </section>

  <!-- FOOTER -->
  <footer>
    <p>© 2025 Eternaldoll — All Rights Reserved</p>
  </footer>

</body>
</html>
